name: shipcheck
description: >-
  The last mile of shipping apps. Analyze any Flutter, Node, or iOS/Android
  project and generate the complete launch kit: store listings, privacy
  disclosures, release notes, and a pre-launch scorecard — from one command.
version: 0.1.0
repository: https://github.com/Awaisdev01/shipcheck
issue_tracker: https://github.com/Awaisdev01/shipcheck/issues
homepage: https://github.com/Awaisdev01/shipcheck
documentation: https://github.com/Awaisdev01/shipcheck#readme

environment:
  sdk: ^3.4.0

executables:
  shipcheck:

dependencies:
  args: ^2.5.0
  path: ^1.9.0
  yaml: ^3.1.0
  http: ^1.2.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
